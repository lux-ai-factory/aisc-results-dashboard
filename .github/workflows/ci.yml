# The unit tests, which need no Superset, database or Docker (README.md, Tests).
name: ci

on:
  push:
    branches: [feat/unified-modules, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: >-
          uv run --no-project --with pytest --with sqlalchemy --with psycopg2-binary
          --with authlib --with flask --with requests --with pyyaml
          python -m pytest -q -p no:cacheprovider tests --ignore tests/test_sso_login.py
        env:
          PYTHONPATH: .
