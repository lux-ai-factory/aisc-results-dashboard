# The unit tests, which need no Superset, database or Docker (README.md, Tests).
name: ci

on:
  push:
    branches: [pilot, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the ledger tests import aisc_identity, which lives in the aisc repository (shared/identity), as it does
      # beside aisc_ext in the stack
      - uses: actions/checkout@v4
        with:
          repository: lux-ai-factory/aisc
          ref: pilot
          path: aisc
          sparse-checkout: shared/identity
      - uses: astral-sh/setup-uv@v5
      - run: >-
          uv run --no-project --with pytest --with sqlalchemy --with psycopg2-binary
          --with authlib --with flask --with requests --with pyyaml
          python -m pytest -q -p no:cacheprovider tests --ignore tests/test_sso_login.py
        env:
          PYTHONPATH: .
          AISC_IDENTITY_DIR: ${{ github.workspace }}/aisc/shared/identity
