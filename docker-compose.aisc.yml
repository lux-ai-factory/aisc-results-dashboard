# Overlay for the standalone stack: connect it to a locally running aisc stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.aisc.yml up -d
#
# Joins the aisc stack's backend network so its Postgres is reachable as
# `postgres:5432` (service name on that network). Set in .env:
#   AISC_MEMBERSHIP_DB_URI=postgresql+psycopg2://dashboard_ro:<pw>@postgres:5432/platform
#   AISC_PROJECT_DB_HOSTPORT=postgres:5432
# The first is read at sign-in for memberships. The second is where project
# connections would point, but this stack forwards no DASHBOARD_BRIDGE_TOKEN or
# DASHBOARD_RO_PASSWORD, so the bridge refuses every call (401) and registers no
# project here: inside AISC the dashboard runs from the aisc repo's compose
# instead. (The platform's init files create dashboard_ro.)
#
# The external network is named "<compose project>_backend", by default
# "aisc_backend". If the aisc stack runs under another compose project name,
# set the real name in .env: AISC_NETWORK=<name> (see `docker network ls`).

services:
  superset:
    networks:
      - default
      - aisc_net

networks:
  aisc_net:
    external: true
    name: ${AISC_NETWORK:-aisc_backend}
